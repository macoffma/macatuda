<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Block — Greybox v0.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8F%98%EF%B8%8F</text></svg>">
<style>
  :root{
    --ground:#eef3ec; --panel:#fbfdf9; --panel-2:#eef4ea; --line:#d3ddca;
    --ink:#1e2b1c; --muted:#5b6b53; --faint:#93a389;
    --accent:#2f9e5c; --sky:#2b8fd6; --gold:#c9971e;
    --good:#2f9e5c; --warn:#c9871e; --bad:#c6504a;
    --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 22px rgba(30,50,20,.07);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0d1510; --panel:#14201699; --panel-2:#182a1c; --line:#2a3d2c;
      --ink:#dcecd6; --muted:#8ba283; --faint:#5d7358;
      --accent:#5cc47f; --sky:#5cb4e6; --gold:#e5c264;
      --good:#5cc47f; --warn:#e0b055; --bad:#e0736b;
      --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --ground:#eef3ec; --panel:#fbfdf9; --panel-2:#eef4ea; --line:#d3ddca;
    --ink:#1e2b1c; --muted:#5b6b53; --faint:#93a389;
    --accent:#2f9e5c; --sky:#2b8fd6; --gold:#c9971e; --good:#2f9e5c; --warn:#c9871e; --bad:#c6504a;
    --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 22px rgba(30,50,20,.07);
  }
  :root[data-theme="dark"]{
    --ground:#0d1510; --panel:#142016; --panel-2:#182a1c; --line:#2a3d2c;
    --ink:#dcecd6; --muted:#8ba283; --faint:#5d7358;
    --accent:#5cc47f; --sky:#5cb4e6; --gold:#e5c264; --good:#5cc47f; --warn:#e0b055; --bad:#e0736b;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.45;margin:0;-webkit-text-size-adjust:100%}
  .wrap{max-width:940px;margin:0 auto;padding:16px 16px 64px}
  h1,h2,h3{text-wrap:balance;margin:0}
  .label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap}
  .mast .title{font-size:21px;font-weight:800}
  .mast .title .sub{color:var(--accent)}
  .mast .ver{font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}

  .hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat .big{font-size:24px;font-weight:800;font-family:var(--mono)}
  .wx{display:flex;align-items:center;gap:9px;margin-top:2px}
  .wx .em{font-size:24px} .wx .nm{font-weight:800;font-size:15px}
  .boosts{margin-top:7px;font-size:13px;color:var(--gold);font-weight:700}
  .mood{font-size:16px;font-weight:800;margin-top:2px}
  .gwbar{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
  .gwfill{height:100%;background:var(--good)} .gwfill.warn{background:var(--warn)} .gwfill.bad{background:var(--bad)}
  .stand{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .stand .p{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
  .chip{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .cash{font-family:var(--mono);font-weight:800}

  .jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:6px 0 12px}
  .job{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
  button.job{transition:transform .08s,border-color .15s,box-shadow .15s}
  button.job:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
  button.job:disabled{opacity:.4;cursor:not-allowed}
  .job .jt{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
  .job .jt .em{font-size:20px}
  .job .addr{font-size:12px;color:var(--faint)}
  .job .vibe{font-size:13px;color:var(--muted)}
  .job .hot{position:absolute;top:10px;right:11px;font-size:11px;font-weight:800;color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent);border:1px solid var(--gold);border-radius:20px;padding:1px 7px}
  .job .who{margin-top:auto;font-size:11px}

  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .stage h2{font-size:16px;margin-bottom:5px}
  .stage .hint{color:var(--muted);font-size:13.5px;margin-bottom:12px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#03210f}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.wide{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:220px;text-align:left}
  .btn.wide .sub{font-size:11.5px;color:var(--muted);font-weight:600}

  .pay{display:flex;align-items:baseline;gap:10px;margin:8px 0}
  .pay .big{font-size:30px;font-weight:800;font-family:var(--mono);color:var(--gold)}
  .pay .brk{font-size:13px;color:var(--muted)}
  .reveal{font-size:18px;font-weight:700;min-height:28px;margin:6px 0;display:flex;align-items:center;gap:8px}
  .reveal.big{color:var(--gold)} .reveal.bad{color:var(--bad)}
  .risk{display:flex;gap:6px;align-items:center;margin:12px 0}
  .risk .track{flex:1;max-width:220px;height:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .risk .fill{height:100%;background:var(--warn);transition:width .2s}
  .risk .fill.hi{background:var(--bad)}
  .banner{padding:11px 14px;border-radius:10px;font-size:13.5px;margin:10px 0}
  .banner.good{background:color-mix(in srgb,var(--good) 15%,transparent);border:1px solid var(--good)}
  .banner.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);border:1px solid var(--bad)}
  .banner.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);border:1px solid var(--gold)}
  .legend{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.6}
  .mtable{display:flex;flex-direction:column;gap:9px;margin:8px 0}
  .mrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mtip{font-size:12.5px;color:var(--muted)} .mtip.up{color:var(--good);font-weight:700}

  .log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px 10px 14px;box-shadow:var(--shadow)}
  .log h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .log .feed{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:8px}
  .log .ln{font-size:13px;color:var(--muted);line-height:1.5}
  .log .ln b{color:var(--ink)} .log .ln .g{color:var(--good)} .log .ln .gold{color:var(--gold);font-weight:700} .log .ln .r{color:var(--bad)}

  .setup{max-width:560px;margin:5vh auto 0}
  .setup p{color:var(--muted);font-size:14px}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  select{font-family:inherit;font-size:14px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  .results .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .results .row.win{color:var(--accent);font-weight:800}
  @media (prefers-reduced-motion:no-preference){ .reveal .em{animation:pop .25s ease} @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}} }
</style>

<div class="wrap">
  <div class="mast">
    <div class="title">The <span class="sub">Block</span></div>
    <div class="ver" id="phaseTag">a summer on the block</div>
  </div>
  <div id="app"></div>
</div>

<script>
"use strict";
window.addEventListener("error", function(e){ var a=document.getElementById("app");
  if(a && !a.dataset.crashed){ a.dataset.crashed="1"; a.innerHTML='<div class="stage"><h2>Something broke</h2><div class="hint">'+((e&&e.message)||"error")+'</div></div>'; } });

/* =========================================================================
   THE BLOCK v0.1 — a neighborhood summer hustle.
   Reinvented from the Overboard engine: base pay is your safe floor, TIPS are
   the press-your-luck (add nice touches, risk a flub). Weather sets what pays
   double. Goodwill is a live commons — a happy block pays everyone more.
   No inventory, no market phase: you're paid on the spot.
   ========================================================================= */

const JOB = {
  mow:  { name:"Mow a lawn",     em:"🌱", touches:["edge it crisp","bag the clippings","trim the border"] },
  rake: { name:"Rake leaves",    em:"🍂", touches:["bag them neat","clear the gutters","sweep the path"] },
  lemon:{ name:"Lemonade stand", em:"🍋", touches:["add fresh mint","upsell cookies","work the crowd"] },
  sit:  { name:"Babysit",        em:"🧸", touches:["build a pillow fort","bake with the kids","read one more story"] },
  wash: { name:"Wash a car",     em:"🧽", touches:["wax the hood","vacuum inside","shine the rims"] },
  dog:  { name:"Walk the dogs",  em:"🐕", touches:["extra-long loop","teach a trick","brush them out"] },
};
const JOBKEYS = Object.keys(JOB);
const ADDR = ["#2 Maple","#7 Maple","#11 Oak","#4 Oak","#9 Pine","#15 Pine","#3 Elm","#8 Elm","the corner lot","#12 Birch"];

const WEATHER = [
  { key:"heat",  em:"🥵", text:"Heat wave — everyone's parched and cars are dusty.", boosts:["lemon","wash"] },
  { key:"sun",   em:"☀️", text:"Sunny and mild — grass is growing, dogs need walking.", boosts:["mow","dog"] },
  { key:"leaves",em:"🍂", text:"Leaves coming down all over the block.", boosts:["rake"] },
  { key:"rain",  em:"🌧️", text:"Rainy day — folks want a hand indoors.", boosts:["sit"] },
  { key:"party", em:"🎉", text:"Block party this weekend — everybody needs help!", boosts:["lemon","sit","wash","mow"] },
];

const GEAR = [
  { key:"flyers",  name:"Flyers & a good rep", cost:7, em:"📋", desc:"See each job's pay & how tricky it is before you take it." },
  { key:"careful", name:"Careful hands",       cost:8, em:"🧤", desc:"Flubs come slower — push for tips more safely." },
  { key:"bike",    name:"A bike",              cost:10,em:"🚲", desc:"Do one more job every day." },
];

const CFG = { startCash:5, days:5, baseCap:2, goodwill0:6, gwMax:10, soured:3, boostMult:2, tip:2 };

let STATE=null;

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const cap=id=>CFG.baseCap+(STATE.gear[id].bike?1:0);
const cash=n=>"$"+n;
function log(h){ STATE.log.unshift(h); if(STATE.log.length>50)STATE.log.pop(); }
function availJobs(){ return STATE.jobs.filter(j=>!j.taken); }

function newGame(np, days){
  const players=[{id:0,name:"You",human:true,color:"#2f9e5c"}];
  const roster=[{name:"Chip",pers:"greedy",color:"#c6504a"},{name:"Dot",pers:"cautious",color:"#2b8fd6"},{name:"Bax",pers:"chaos",color:"#9a6cc9"}];
  for(let i=0;i<np-1;i++){ const a=roster[i]; players.push({id:i+1,name:a.name,human:false,pers:a.pers,color:a.color}); }
  const money={},gear={}; players.forEach(p=>{ money[p.id]=CFG.startCash; gear[p.id]={flyers:false,careful:false,bike:false}; });
  STATE={ day:1, maxDays:days, phase:"job", players, money, gear, goodwill:CFG.goodwill0,
    weather:null, nextWeather:pick(WEATHER), jobs:[], humanDone:0, work:null, pay:null, night:null, log:[] };
  startDay();
}
function startDay(){
  const S=STATE;
  S.weather=S.nextWeather||pick(WEATHER); S.nextWeather=pick(WEATHER);
  S.humanDone=0;
  const n=S.players.length*2+3;
  S.jobs=[]; const addrs=ADDR.slice();
  for(let i=0;i<n;i++){
    const type=pick(JOBKEYS), base=3+rnd(4), tricky=Math.random()<0.35;
    const ai=rnd(addrs.length); const addr=addrs.splice(ai,1)[0]||"a house";
    S.jobs.push({ id:i, type, addr, base, tricky, taken:false, takenBy:null });
  }
  log(`<span class="ln"><b>— Day ${S.day} —</b> ${S.weather.em} ${S.weather.text}</span>`);
  S.phase="job"; render();
}
function jobPay(j){ // base pay incl. weather boost + live goodwill mood
  let p=j.base;
  if(STATE.weather.boosts.includes(j.type)) p*=CFG.boostMult;
  if(STATE.goodwill>=8) p+=1; else if(STATE.goodwill<=CFG.soured) p=Math.max(1,p-1);
  return p;
}

/* ---- pick a job ---- */
function takeJob(id){
  const S=STATE, j=S.jobs.find(x=>x.id===id); if(!j||j.taken) return;
  j.taken=true; j.takenBy=0;
  const base=jobPay(j), risk=0.12+(j.tricky?0.16:0);
  S.work={ jobId:id, type:j.type, addr:j.addr, base, tips:0, risk, baseRisk:risk, touches:0, done:false, flubbed:false,
    boosted:S.weather.boosts.includes(j.type), reveal:"" };
  S.phase="work"; render();
}
/* ---- work the job (press your luck for tips) ---- */
function work(action){
  const S=STATE, W=S.work; if(!W||W.done) return;
  if(action==="done"){ W.done=true; finishJob(); return; }
  // add a nice touch
  W.touches++;
  if(Math.random()<W.risk){ // flub!
    const mishaps={ mow:"You clipped the flowerbed! 🌷", rake:"The bag split everywhere! 💨", lemon:"You knocked the pitcher over! 💦",
      sit:"The toddler had a meltdown! 😭", wash:"You left streaks all over! 😬", dog:"A dog slipped the leash! 🐕💨" };
    W.reveal=(mishaps[W.type]||"Whoops!")+" No tip this time.";
    W.tips=0; W.flubbed=true; W.done=true; finishJob(); return;
  }
  W.tips+=CFG.tip;
  const t=JOB[W.type].touches; W.reveal=`You ${t[(W.touches-1)%t.length]} — the neighbor loves it! +${cash(CFG.tip)} tip`;
  W.risk += (S.gear[0].careful?0.10:0.18);
  render();
}
function finishJob(){
  const S=STATE, W=S.work, j=S.jobs.find(x=>x.id===W.jobId);
  const earned = W.flubbed ? W.base : W.base+W.tips;
  S.money[0]+=earned;
  S.goodwill = Math.max(0, Math.min(CFG.gwMax, S.goodwill + (W.flubbed?-1:1)));
  S.pay={ earned, base:W.base, tips:W.flubbed?0:W.tips, flubbed:W.flubbed, boosted:W.boosted, type:W.type, addr:W.addr };
  log(`<span class="ln"><b style="color:#2f9e5c">You</b> ${JOB[W.type].name.toLowerCase()} at ${W.addr} — <span class="${W.flubbed?'r':'g'}">${cash(earned)}</span>${W.flubbed?" (flubbed the tip)":W.tips?` <span class="gold">(+${cash(W.tips)} tips)</span>`:""}.</span>`);
  S.work=null; S.phase="payday"; render();
}
function paydayNext(){
  const S=STATE; S.humanDone++;
  if(S.humanDone<cap(0) && availJobs().length>0){ S.phase="job"; render(); }
  else endHumanDay();
}
/* ---- rivals work, then shop, then evening ---- */
function endHumanDay(){
  const S=STATE;
  S.players.filter(p=>!p.human).forEach(p=>{
    let jobs=cap(p.id);
    while(jobs-->0){
      const pool=availJobs(); if(!pool.length) break;
      let j;
      if(p.pers==="chaos") j=pick(pool);
      else if(p.pers==="cautious") j=pool.slice().sort((a,b)=>(a.tricky-b.tricky)||(jobPay(b)-jobPay(a)))[0];
      else j=pool.slice().sort((a,b)=>jobPay(b)-jobPay(a))[0];
      j.taken=true; j.takenBy=p.id;
      aiWork(p, j);
    }
  });
  startStore();
}
function aiWork(p, j){
  const S=STATE; let base=jobPay(j), tips=0, risk=0.12+(j.tricky?0.16:0), flub=false;
  const pushes = p.pers==="greedy"?3 : p.pers==="cautious"?1 : 1+rnd(3);
  for(let k=0;k<pushes;k++){ if(Math.random()<risk){ flub=true; break; } tips+=CFG.tip; risk+=0.18; }
  const earned = flub?base:base+tips;
  S.money[p.id]+=earned;
  S.goodwill=Math.max(0,Math.min(CFG.gwMax,S.goodwill+(flub?-1:1)));
  log(`<span class="ln"><b style="color:${p.color}">${p.name}</b> did ${JOB[j.type].name.toLowerCase()} — <span class="${flub?'r':'g'}">${cash(earned)}</span>${flub?" (flub)":""}.</span>`);
}
function startStore(){
  const S=STATE;
  const cheapest=Math.min.apply(null,GEAR.filter(g=>!S.gear[0][g.key]).map(g=>g.cost).concat([999]));
  if(S.money[0]<cheapest){ startEvening(); return; }
  S.phase="store"; render();
}
function buyGear(key){
  const S=STATE, g=GEAR.find(x=>x.key===key);
  if(!g||S.gear[0][key]||S.money[0]<g.cost) return;
  S.money[0]-=g.cost; S.gear[0][key]=true;
  log(`<span class="ln"><b style="color:#2f9e5c">You</b> got <span class="gold">${g.name}</span> ${g.em}.</span>`);
  render();
}
function storeDone(){ startEvening(); }
function startEvening(){
  const S=STATE, gw=S.goodwill;
  S.night={ gw, soured: gw<=CFG.soured };
  if(gw<=CFG.soured) log(`<span class="ln"><span class="r">⚠ The block's getting grumpy (goodwill low).</span></span>`);
  S.phase="evening"; render();
}
function nextDay(){ const S=STATE; if(S.day>=S.maxDays){ endGame(); return; } S.day++; startDay(); }
function endGame(){ const S=STATE; S.soured=S.goodwill<=CFG.soured; S.phase="over"; render(); }

/* ---------- render ---------- */
function moodOf(gw){ if(gw<=CFG.soured)return{t:"Grumbling",c:"var(--bad)",f:"bad"}; if(gw>=8)return{t:"Loves you kids!",c:"var(--good)",f:""}; return{t:"Friendly",c:"var(--warn)",f:"warn"}; }
function boostList(){ return STATE.weather.boosts.map(k=>`${JOB[k].em}`).join(" "); }

function hud(){
  const S=STATE, gw=S.goodwill, m=moodOf(gw);
  const stand=S.players.slice().sort((a,b)=>S.money[b.id]-S.money[a.id]).map(p=>{
    const g=["flyers","careful","bike"].filter(k=>S.gear[p.id][k]).length;
    return `<div class="p"><span><span class="chip" style="background:${p.color}"></span>${p.name}${g?` <span style="color:var(--faint)">·${g}⚙</span>`:""}</span><span class="cash">${cash(S.money[p.id])}</span></div>`;
  }).join("");
  return `<div class="hud">
    <div class="card stat"><div class="label">Day</div><div class="big">${S.day}<span style="color:var(--faint);font-size:15px"> / ${S.maxDays}</span></div></div>
    <div class="card"><div class="label">Today</div><div class="wx"><span class="em">${S.weather.em}</span><span class="nm">${S.weather.key[0].toUpperCase()+S.weather.key.slice(1)}</span></div><div class="boosts">${boostList()} pay double</div></div>
    <div class="card"><div class="label">The Block</div><div class="mood" style="color:${m.c}">${m.t}</div><div class="gwbar"><div class="gwfill ${m.f}" style="width:${gw/CFG.gwMax*100}%"></div></div></div>
    <div class="card"><div class="label">Savings</div><div class="stand">${stand}</div></div>
  </div>`;
}
function jobsBoard(){
  const S=STATE, flyers=S.gear[0].flyers;
  return `<div class="jobs">`+S.jobs.map(j=>{
    if(j.taken){ const who=S.players.find(p=>p.id===j.takenBy);
      return `<div class="job" style="opacity:.5"><div class="jt"><span class="em">${JOB[j.type].em}</span>${JOB[j.type].name}</div><div class="addr">${j.addr}</div><div class="who" style="color:${who?who.color:'var(--faint)'}">${who?(who.human?"yours":who.name+"'s"):"taken"}</div></div>`; }
    const hot=S.weather.boosts.includes(j.type);
    const vibe = flyers ? `${cash(jobPay(j))}${hot?" (×2 today!)":""} · ${j.tricky?"tricky":"easy"}`
      : (j.tricky?"Looks like a handful":j.base>=5?"Could pay well":"Easy money");
    return `<button class="job" data-act="take" data-id="${j.id}">
      ${hot?`<span class="hot">HOT ${JOB[j.type].em}</span>`:""}
      <div class="jt"><span class="em">${JOB[j.type].em}</span>${JOB[j.type].name}</div>
      <div class="addr">${j.addr}</div>
      <div class="vibe">${vibe}</div>
    </button>`;
  }).join("")+`</div>`;
}
function stageJob(){
  const S=STATE, left=cap(0)-S.humanDone;
  return `<div class="stage"><h2>What'll you do${S.humanDone>0?" next":""}, ${S.humanDone>0?"":"kiddo"}?</h2>
    <div class="hint">${S.weather.em} ${S.weather.text} — <b>${boostList()}</b> pay double today. You've got time for <b>${left}</b> more ${left===1?"job":"jobs"}.</div>
    ${jobsBoard()}
    <div class="legend">${S.gear[0].flyers?"Your flyers show each job's pay.":"You won't know the exact pay 'til you start — take a job and see."} HOT = today's weather pays it double.</div>
  </div>`;
}
function stageWork(){
  const S=STATE, W=S.work, j=JOB[W.type];
  const riskPct=Math.min(100,Math.round(W.risk*100)), hi=W.risk>=0.5;
  return `<div class="stage"><h2>${j.name} · ${W.addr}</h2>
    <div class="hint">You're getting <b>${cash(W.base)}</b> for the job${W.boosted?' <span style="color:var(--gold)">(double — it\'s hot today!)</span>':""}. Add nice touches for tips — but push too far and you'll flub it and lose the tips.</div>
    <div class="reveal ${W.flubbed?'bad':W.tips>0?'big':''}">${W.reveal||"&nbsp;"}</div>
    <div class="pay"><span class="big">${cash(W.base+W.tips)}</span><span class="brk">${cash(W.base)} job${W.tips?` + ${cash(W.tips)} tips`:""}</span></div>
    <div class="risk"><span class="label">Flub chance</span><div class="track"><div class="fill ${hi?'hi':''}" style="width:${riskPct}%"></div></div><span class="mtip">${riskPct}%</span></div>
    <div class="btnrow">
      <button class="btn primary" data-act="touch">✨ Add a nice touch (+${cash(CFG.tip)} tip)</button>
      <button class="btn" data-act="wrapup">Call it done — take ${cash(W.base+W.tips)}</button>
    </div></div>`;
}
function stagePayday(){
  const S=STATE, P=S.pay;
  return `<div class="stage"><h2>${P.flubbed?"Ah well…":"Nice work! 🎉"}</h2>
    ${P.flubbed?`<div class="banner bad">You flubbed the tip, but you still got paid for the job.</div>`
      :`<div class="banner good">Neighbor's thrilled — the block likes you a little more.</div>`}
    <div class="pay"><span class="big">${cash(P.earned)}</span><span class="brk">${cash(P.base)} job${P.tips?` + ${cash(P.tips)} tips`:""}${P.boosted?" · double pay!":""}</span></div>
    <div class="btnrow"><button class="btn primary" data-act="payday-next">${cap(0)-S.humanDone>1 && availJobs().length>0?"On to the next job →":"Head home for the day →"}</button></div>
  </div>`;
}
function stageStore(){
  const S=STATE, c=S.money[0];
  const cards=GEAR.map(g=>{ const owned=S.gear[0][g.key], afford=c>=g.cost;
    return `<div class="mrow"><button class="btn wide" data-act="buy" data-key="${g.key}" ${(owned||!afford)?"disabled":""}>
      <span>${g.em} <b>${g.name}</b> ${owned?'<span class="sub" style="color:var(--good)">· got it</span>':`<span class="sub">· ${cash(g.cost)}</span>`}</span>
      <span class="sub">${g.desc}</span></button>${owned?'<span class="mtip up">✓</span>':(afford?'':'<span class="mtip">save up</span>')}</div>`;
  }).join("");
  return `<div class="stage"><h2>Corner store 🏪</h2>
    <div class="hint">You've got ${cash(c)} saved. Gear makes the rest of the summer easier and richer — or keep saving.</div>
    <div class="mtable">${cards}</div>
    <div class="btnrow"><button class="btn primary" data-act="store-done">Home for the night →</button></div>
  </div>`;
}
function stageEvening(){
  const S=STATE, N=S.night, last=S.day>=S.maxDays, m=moodOf(N.gw);
  return `<div class="stage"><h2>Evening on the block</h2>
    ${N.soured?`<div class="banner bad">The neighbors are getting grumpy. If the block's still sour at summer's end, everyone's savings take a hit — do some clean jobs and don't overdo it.</div>`
      :`<div class="banner good">The block is <b>${m.t.toLowerCase()}</b> tonight.</div>`}
    <div class="hint">Tomorrow: ${S.nextWeather.em} looks like ${S.nextWeather.key}.</div>
    <div class="btnrow"><button class="btn primary" data-act="next-day">${last?"See how the summer went":"Next morning →"}</button></div>
  </div>`;
}
function stageOver(){
  const S=STATE, mult=S.soured?0.5:1;
  const score={}; S.players.forEach(p=>score[p.id]=Math.floor(S.money[p.id]*mult));
  const ranked=S.players.slice().sort((a,b)=>score[b.id]-score[a.id]), win=ranked[0];
  const rows=ranked.map((p,i)=>`<div class="row ${i===0?'win':''}"><span><span class="chip" style="background:${p.color}"></span>${p.name}${i===0?" 🏆":""}</span><span class="cash">${cash(score[p.id])}</span></div>`).join("");
  return `<div class="stage results"><h2>End of summer</h2>
    ${S.soured?`<div class="banner bad">The block soured on all the hustle — everyone's savings were halved. Next summer, be a better neighbor. 🏘️</div>`:`<div class="banner good">A great summer on the block! 🌞</div>`}
    <div style="margin:10px 0">${rows}</div>
    <div class="hint">${win.human?"You're the top kid on the block! 🏆":win.name+" out-hustled you this summer — get 'em next year."}</div>
    <div class="btnrow"><button class="btn primary" data-act="restart">Another summer</button></div>
    <div class="legend">The Block v0.1 — base pay is your safe floor, tips are the gamble, weather says what's hot, and a happy block pays everyone more. Fun for a few rounds? Then art + the TV/iPad build.</div>
  </div>`;
}
function setup(){
  return `<div class="setup"><div class="stage"><h2>The Block 🏘️</h2>
    <p>A summer on the block. Take odd jobs — mow, rake, babysit, run a lemonade stand — do them well for tips, and out-earn the other neighborhood kids. Chase what the weather makes hot, but keep the neighbors happy: a grumpy block pays everyone less.</p>
    <div class="field"><span class="label">Kids (you + rivals)</span>
      <select id="np"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div>
    <div class="field"><span class="label">Days of summer</span>
      <select id="nd"><option>4</option><option selected>5</option><option>6</option></select></div>
    <div class="btnrow" style="margin-top:16px"><button class="btn primary" data-act="start">☀️ Start the summer</button></div>
    <div class="legend">The other kids: Chip (greedy hustler), Dot (steady &amp; reliable), Bax (a bit chaotic).</div>
  </div></div>`;
}
function render(){
  const S=STATE, app=document.getElementById("app"), tag=document.getElementById("phaseTag");
  if(!S){ app.innerHTML=setup(); if(tag)tag.textContent="a summer on the block"; return; }
  const P=S.phase; let stage="";
  if(P==="job") stage=stageJob();
  else if(P==="work") stage=stageWork();
  else if(P==="payday") stage=stagePayday();
  else if(P==="store") stage=stageStore();
  else if(P==="evening") stage=stageEvening();
  else if(P==="over"){ app.innerHTML=stageOver(); if(tag)tag.textContent="summer's over"; return; }
  const feed=`<div class="log"><h3>Around the block</h3><div class="feed">${S.log.join("")||'<span class="ln">…</span>'}</div></div>`;
  app.innerHTML = hud() + stage + feed;
  if(tag) tag.textContent=({job:"picking a job",work:"on the job",payday:"payday",store:"corner store",evening:"evening"})[P]||"the block";
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="start") newGame(parseInt(document.getElementById("np").value), parseInt(document.getElementById("nd").value));
  else if(a==="take") takeJob(parseInt(b.dataset.id));
  else if(a==="touch") work("touch");
  else if(a==="wrapup") work("done");
  else if(a==="payday-next") paydayNext();
  else if(a==="buy") buyGear(b.dataset.key);
  else if(a==="store-done") storeDone();
  else if(a==="next-day") nextDay();
  else if(a==="restart"){ STATE=null; render(); }
});
function boot(){ try{ render(); }catch(err){ var a=document.getElementById("app"); if(a) a.innerHTML='<div class="stage"><h2>Boot error</h2><div class="hint">'+((err&&err.message)||err)+'</div></div>'; } }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
</body>
</html>
