<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grab a Job — The Block feel-test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%9B%92</text></svg>">
<style>
  :root{ --ground:#e9f0ec; --panel:#fbfdfb; --line:#cdd9d2; --ink:#1b2a24; --muted:#5a6f64;
    --grass:#2f9e5c; --gold:#c9971e; --bad:#c6504a; --sky:#2b8fd6; --plum:#8a5cc9;
    --shadow:0 10px 28px rgba(20,45,30,.12); --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace; }
  @media (prefers-color-scheme:dark){ :root{ --ground:#0b1512; --panel:#122019; --line:#26372c; --ink:#dceee4; --muted:#84a091; --grass:#5cc47f; --gold:#e5c264; --bad:#e0736b; --sky:#5cb4e6; --plum:#a98ce0; --shadow:0 14px 40px rgba(0,0,0,.5);} }
  :root[data-theme="light"]{ --ground:#e9f0ec; --panel:#fbfdfb; --line:#cdd9d2; --ink:#1b2a24; --muted:#5a6f64; --grass:#2f9e5c; --gold:#c9971e; --bad:#c6504a; --sky:#2b8fd6; --plum:#8a5cc9;}
  :root[data-theme="dark"]{ --ground:#0b1512; --panel:#122019; --line:#26372c; --ink:#dceee4; --muted:#84a091; --grass:#5cc47f; --gold:#e5c264; --bad:#e0736b; --sky:#5cb4e6; --plum:#a98ce0;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:none}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 22px}
  .mast{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px;flex-wrap:wrap}
  .title{font-size:18px;font-weight:850} .title .b{color:var(--grass)}
  .vtag{font-size:11px;color:#fff;background:var(--grass);font-weight:800;padding:1px 8px;border-radius:20px;margin-left:4px}
  .sub{font-size:12px;color:var(--muted)}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:13px;font-weight:700}
  .hot{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--gold) 16%,var(--panel));border:1px solid var(--gold);border-radius:999px;padding:3px 11px;font-weight:800}
  .you{display:flex;align-items:center;gap:6px;color:var(--muted)} .you b{color:var(--grass)}
  .stagewrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
  canvas{display:block;width:100%;height:auto;touch-action:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:color-mix(in srgb,var(--ink) 44%,transparent);backdrop-filter:blur(2px);z-index:3}
  .overlay h2{margin:0;color:#fff;font-size:clamp(19px,5.5vw,25px);font-weight:900;text-wrap:balance}
  .overlay p{margin:0;color:#eaf4ee;font-size:13.5px;max-width:33ch;line-height:1.5}
  .obtn{border:0;border-radius:14px;padding:13px 26px;font-size:16px;font-weight:900;background:var(--grass);color:#04210f;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:11px;line-height:1.5}.hint b{color:var(--ink)}
</style>

<div class="wrap">
  <div class="mast">
    <div class="title">Grab a <span class="b">Job</span><span class="vtag" id="vtag"></span></div>
    <div class="sub">a feel-test for The Block</div>
  </div>
  <div class="hud">
    <div class="hot">🔥 Hot today: 🌿 🐕 🍋 · pay <b>double</b></div>
    <div class="you">you: <b>🧒</b></div>
  </div>
  <div class="stagewrap">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov"></div>
  </div>
  <div class="hint"><b>Drag to haul your cart to any house</b> and claim that job. The 🔥 gold ones pay double — but the other kids want them too. Grab a good one before it's gone.</div>
</div>

<script>
"use strict";
const VERSION="0.4";
const cv=document.getElementById("cv"), ctx=cv.getContext("2d"), ov=document.getElementById("ov");
let W=0,H=0,dpr=1,S=null,raf=null,last=0,goodGrabs=0,games=0;
const $=id=>document.getElementById(id);
const V=(x,y)=>({x,y}); const sub=(a,b)=>V(a.x-b.x,a.y-b.y); const add=(a,b)=>V(a.x+b.x,a.y+b.y);
const mul=(a,s)=>V(a.x*s,a.y*s); const len=a=>Math.hypot(a.x,a.y); const norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l)};
const dark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function resize(){ const cssW=cv.clientWidth; const cssH=Math.round(cssW*1.24);
  dpr=Math.min(2,window.devicePixelRatio||1); cv.width=cssW*dpr; cv.height=cssH*dpr; cv.style.height=cssH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0); W=cssW; H=cssH; if(S) layout(); }

const HOTSET=["🌿","🐕","🍋"];
function layout(){ const w=W,h=H;
  S.roads=[{x:w*0.42,y:0,w:w*0.16,h:h},{x:0,y:h*0.32,w:w,h:w*0.14},{x:0,y:h*0.66,w:w,h:w*0.14}];
  // houses sit in the BLOCKS between the streets — never on the vertical main road (x .42–.58)
  // or in the crossroad bands (y .32–.44, .66–.77) — so nothing ever blocks your driving lane.
  const SPOTS=[[0.15,0.15],[0.85,0.15],[0.15,0.53],[0.85,0.53],[0.15,0.90],[0.85,0.90]];
  if(!S.houses){
    const cues=["🌿","🧸","🍂","🐕","🍋","🚗"];  // hot (🌿🐕🍋) spread to TL / MR / BL corners
    S.houses=SPOTS.map((s,i)=>{ const cue=cues[i]; const hot=HOTSET.includes(cue);
      return {x:w*s[0],y:h*s[1],cue,hot,pay:hot?9:4,by:null}; });
  } else S.houses.forEach((hh,i)=>{ hh.x=w*SPOTS[i][0]; hh.y=h*SPOTS[i][1]; });
  // random "homes" on the road network — everyone starts from a different corner of the streets
  const HOMES=[[0.5,0.97],[0.5,0.03],[0.04,0.32],[0.96,0.32],[0.04,0.66],[0.96,0.66]];
  if(!S.kids){
    const homes=HOMES.slice(); for(let i=homes.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=homes[i];homes[i]=homes[j];homes[j]=t;}
    const defs=[
      {id:0,me:true,name:"You",color:cssv('--grass'),face:"🧒",spd:200},
      {id:1,name:"Chip",color:cssv('--bad'),face:"🦝",spd:174},
      {id:2,name:"Dot",color:cssv('--sky'),face:"🐹",spd:170},
      {id:3,name:"Bax",color:cssv('--plum'),face:"🐰",spd:166},
    ];
    S.kids=defs.map((d,i)=>{ const hm=homes[i], p=V(w*hm[0],h*hm[1]);
      return Object.assign({}, d, { p:V(p.x,p.y), cart:V(p.x, p.y+(hm[1]>0.5?-18:18)), cv:V(0,0), v:V(0,0),
        load: d.me?2 : 1+((Math.random()*3)|0), noise:V(0,0), tgt:null, route:null, rp:0, claimed:false, delay: d.me?0:0.3+Math.random()*0.9 }); });
  } else S.kids.forEach(k=>{ k.p.x=Math.max(10,Math.min(w-10,k.p.x)); k.p.y=Math.max(10,Math.min(h-10,k.p.y)); });
  S.L=Math.max(24,w*0.085); S.claimR=Math.max(30,w*0.11);
}
function reset(){ S={target:null,phase:"ready",houses:null,kids:null,moved:false}; layout();
  ov.innerHTML=`<h2>Grab a job before the other kids!</h2><p>Drag your cart to a house. 🔥 gold ones pay double — everyone's after those.</p><button class="obtn" id="go">Out you go!</button>`;
  ov.style.display="flex"; $("go").addEventListener("pointerdown",e=>{e.preventDefault();start();}); draw();
}
function start(){ if(S.phase!=="ready")return; S.phase="run"; ov.style.display="none"; last=performance.now(); raf=requestAnimationFrame(loop); }
function onRoad(p){ return S.roads.some(r=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h); }
function nearestHouse(kid,preferHot){ let best=null,bd=1e9;
  S.houses.forEach(hh=>{ if(hh.by!==null)return; let d=Math.hypot(kid.p.x-hh.x,kid.p.y-hh.y-16); if(preferHot&&!hh.hot)d+=260;
    if(d<bd){bd=d;best=hh;} }); return best; }

function loop(now){ const dt=Math.min(0.033,(now-last)/1000); last=now; update(dt); draw(); if(S.phase==="run") raf=requestAnimationFrame(loop); }
function cartFollow(k,dt){ let to=sub(k.p,k.cart),d=len(to); k.cart=add(k.cart,mul(k.cv,dt)); to=sub(k.p,k.cart);d=len(to);
  if(d>S.L){ const pull=mul(norm(to),d-S.L); k.cart=add(k.cart,pull); k.cv=add(mul(k.cv,0.86),mul(pull,5)); } else k.cv=mul(k.cv,0.86); }
function loadMult(k){ return 1/(1+0.15*(k.load||0)); }                 // more stuff in the cart = slower
function steerKid(k,aim,dt){
  const base=(onRoad(k.p)?k.spd:k.spd*0.68)*loadMult(k);              // grass is slower than the road
  let desired=V(0,0); if(aim){ const to=sub(aim,k.p),dl=len(to); if(dl>4) desired=mul(norm(to),base); }
  const backv=norm(sub(k.p,k.cart)); const head=norm((desired.x||desired.y)?desired:k.v);
  const align=Math.max(0,backv.x*head.x+backv.y*head.y); const penalty=0.55+0.45*align; // sharp turns swing the cart & slow you
  k.v=add(mul(k.v,1-Math.min(1,9*dt)),mul(desired,Math.min(1,9*dt)*penalty));
  k.p=add(k.p,mul(k.v,dt)); k.p.x=Math.max(10,Math.min(W-10,k.p.x)); k.p.y=Math.max(10,Math.min(H-10,k.p.y));
  cartFollow(k,dt);
}
function buildRoute(from,house){ const vx=W*0.5;                       // route along the roads: onto the main street, along a crossroad, up to the house
  const crossY = Math.abs(house.y-H*0.32) < Math.abs(house.y-H*0.66) ? H*0.32 : H*0.66;
  return [ V(vx,from.y), V(vx,crossY), V(house.x,crossY), V(house.x,house.y+16) ];
}
function update(dt){
  S.clock=(S.clock||0)+dt; if(S.clock>20){ finish(S.houses.find(h=>h.by===0)||null); return; }
  // player — steer toward the drag point (same physics as everyone)
  const Y=S.kids[0]; steerKid(Y, S.target, dt);
  for(const hh of S.houses){ if(hh.by===null && Math.hypot(Y.p.x-hh.x,Y.p.y-hh.y-16)<S.claimR){ hh.by=0; finish(hh); return; } }
  // rivals — pick a job, route along the ROADS, drive it with human wobble + cart swing
  for(let i=1;i<S.kids.length;i++){ const k=S.kids[i];
    if(k.claimed) continue;
    if(!S.moved){ continue; }            // everyone waits at home until YOU head out
    if(k.delay>0){ k.delay-=dt; continue; }  // then a short, staggered human reaction time
    if(!k.tgt || k.tgt.by!==null){ k.tgt=nearestHouse(k,true)||nearestHouse(k,false); if(k.tgt){ k.route=buildRoute(k.p,k.tgt); k.rp=0; } }
    if(!k.tgt) continue;
    k.noise=add(mul(k.noise,0.92), V((Math.random()-0.5)*3,(Math.random()-0.5)*3));  // human-ish weave
    if(len(k.noise)>16) k.noise=mul(norm(k.noise),16);
    const wp=k.route[k.rp], last=k.rp>=k.route.length-1;
    const reach = last? S.claimR : Math.max(18,S.claimR*0.7);
    if(Math.hypot(k.p.x-wp.x,k.p.y-wp.y) < reach){ if(last){ k.tgt.by=k.id; k.claimed=true; k.v=mul(k.v,0.3); continue; } k.rp++; }
    steerKid(k, add(wp, last?V(0,0):k.noise), dt);   // wobble en route, aim true at the door
  }
  if(S.houses.every(hh=>hh.by!==null)){ finish(S.houses.find(h=>h.by===0)||null); return; }
  // rivals have each grabbed their one job & parked — the scramble's over. Give a hustling
  // player a brief window to still land a leftover, then wrap so it never feels frozen.
  if(S.kids.slice(1).every(k=>k.claimed)){ S.grace=(S.grace||0)+dt; if(S.grace>4){ finish(S.houses.find(h=>h.by===0)||null); } }
}
function rr(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }
function draw(){
  ctx.fillStyle=dark()?"#16241a":"#cfe3d2"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=dark()?"#2c3a30":"#b9c6bd"; S.roads.forEach(r=>{rr(r.x,r.y,r.w,r.h,10);ctx.fill();});
  ctx.strokeStyle="rgba(255,255,255,.45)";ctx.lineWidth=2;ctx.setLineDash([9,10]);ctx.beginPath();ctx.moveTo(W*0.5,0);ctx.lineTo(W*0.5,H);ctx.stroke();ctx.setLineDash([]);
  // houses
  S.houses.forEach(h=>{ const s=46; const claimed=h.by!==null; const claimer=claimed?S.kids[h.by]:null;
    ctx.save(); if(h.hot&&!claimed){ctx.shadowColor=cssv('--gold');ctx.shadowBlur=15;}
    ctx.fillStyle=cssv('--panel'); ctx.strokeStyle=claimed?claimer.color:(h.hot?cssv('--gold'):cssv('--line')); ctx.lineWidth=claimed?3:(h.hot?3:1.5);
    rr(h.x-s/2,h.y,s,s,10); ctx.globalAlpha=claimed?0.55:1; ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.globalAlpha=claimed?0.6:1;
    ctx.font="24px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(claimed?"🏠":h.cue,h.x,h.y+s/2-1);
    ctx.font="700 12px "+cssv('--sans'); ctx.fillStyle=claimed?claimer.color:(h.hot?cssv('--gold'):cssv('--muted'));
    ctx.fillText(claimed?("● "+claimer.name):("$"+h.pay+(h.hot?" 🔥":"")), h.x, h.y+s+9);
    ctx.globalAlpha=1; });
  // kids
  for(let i=S.kids.length-1;i>=0;i--){ const k=S.kids[i]; if(k.delay>0&&!k.me) {/*still draw at home*/}
    // rope
    ctx.strokeStyle=k.color;ctx.lineWidth=3;ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(k.p.x,k.p.y);ctx.lineTo(k.cart.x,k.cart.y);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=cssv('--panel');ctx.strokeStyle=k.color;ctx.lineWidth=2; rr(k.cart.x-12,k.cart.y-10,24,20,6);ctx.fill();ctx.stroke();
    ctx.font="13px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(k.me?"🛒":"🧺",k.cart.x,k.cart.y);
    for(let L=0;L<(k.load||0);L++){ ctx.fillStyle=k.color; ctx.beginPath(); ctx.arc(k.cart.x-7+L*7,k.cart.y-13,2.4,0,7); ctx.fill(); } // load = weight
    ctx.beginPath();ctx.arc(k.p.x,k.p.y,13,0,7);ctx.fillStyle=k.color;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle="#fff";ctx.stroke();
    ctx.font="15px serif";ctx.fillText(k.face,k.p.x,k.p.y+1); }
}
function finish(h){ S.phase="done"; cancelAnimationFrame(raf); raf=null; games++;
  let head,body;
  if(h&&h.hot){ goodGrabs++; head=`🔥 You grabbed a hot ${h.cue} job — $${h.pay}!`; body=`Beat the others to it. That's the good money today.`; }
  else if(h){ head=`${h.cue} You got a $${h.pay} job.`; body=`The 🔥 gold jobs went fast — you took what was left. Hustle sooner next time.`; }
  else { head=`😴 You dawdled — nothing left!`; body=`The other kids grabbed everything. Get moving next round.`; }
  ov.innerHTML=`<h2>${head}</h2><p>${body}</p><p style="opacity:.8">Landed a hot job ${goodGrabs}/${games}.</p><button class="obtn" id="go">Go again</button>`;
  ov.style.display="flex"; $("go").addEventListener("pointerdown",e=>{e.preventDefault(); reset(); start();});
}
function pt(e){ const r=cv.getBoundingClientRect(); return V(e.clientX-r.left,e.clientY-r.top); }
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); if(S&&S.phase==="run"){ S.target=pt(e); S.moved=true; cv.setPointerCapture(e.pointerId);} });
cv.addEventListener("pointermove",e=>{ if(S&&S.target&&S.phase==="run") S.target=pt(e); });
cv.addEventListener("pointerup",()=>{ if(S) S.target=null; });
cv.addEventListener("pointercancel",()=>{ if(S) S.target=null; });
window.addEventListener("resize",resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(S)draw(); });
function boot(){ $("vtag").textContent="v"+VERSION; resize(); reset(); }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
</script>
</body>
</html>
