<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overboard — Greybox v0.4</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%A3</text></svg>">
<style>
  /* ---- Warm seaside greybox. Tokened for light/dark. ---- */
  :root{
    --ground:#eaf1f0; --panel:#fbfdfc; --panel-2:#eef5f3; --line:#cad9d6;
    --ink:#183033; --muted:#4f6b69; --faint:#89a3a0;
    --accent:#0f9a8e; --sea:#2c9bd6;
    --good:#1f9d6b; --warn:#d08a2c; --bad:#c65046; --gold:#c98a1e;
    --cod:#8894a0; --bass:#3f93c4; --tuna:#d0762c;
    --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 22px rgba(20,50,50,.07);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0a1618; --panel:#0f2226; --panel-2:#14282d; --line:#22383d;
      --ink:#dcefec; --muted:#82a09d; --faint:#587472;
      --accent:#4fd1c5; --sea:#57b4e6;
      --good:#5bbf8a; --warn:#e0a458; --bad:#e0736b; --gold:#e8c069;
      --cod:#9fb1b9; --bass:#63b4e0; --tuna:#e8a45e;
      --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --ground:#eaf1f0; --panel:#fbfdfc; --panel-2:#eef5f3; --line:#cad9d6;
    --ink:#183033; --muted:#4f6b69; --faint:#89a3a0;
    --accent:#0f9a8e; --sea:#2c9bd6; --good:#1f9d6b; --warn:#d08a2c; --bad:#c65046; --gold:#c98a1e;
    --cod:#8894a0; --bass:#3f93c4; --tuna:#d0762c;
    --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 22px rgba(20,50,50,.07);
  }
  :root[data-theme="dark"]{
    --ground:#0a1618; --panel:#0f2226; --panel-2:#14282d; --line:#22383d;
    --ink:#dcefec; --muted:#82a09d; --faint:#587472;
    --accent:#4fd1c5; --sea:#57b4e6; --good:#5bbf8a; --warn:#e0a458; --bad:#e0736b; --gold:#e8c069;
    --cod:#9fb1b9; --bass:#63b4e0; --tuna:#e8a45e;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.45;margin:0;-webkit-text-size-adjust:100%}
  .wrap{max-width:940px;margin:0 auto;padding:16px 16px 64px}
  h1,h2,h3{text-wrap:balance;margin:0}
  .label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap}
  .mast .title{font-size:21px;font-weight:800;letter-spacing:.01em}
  .mast .title .sub{color:var(--accent)}
  .mast .ver{font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}

  .hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat .big{font-size:24px;font-weight:800;font-family:var(--mono)}
  .catch{display:flex;align-items:center;gap:9px;margin-top:2px}
  .catch .em{font-size:24px}
  .catch .nm{font-weight:800;font-size:16px}
  .demand{display:inline-flex;gap:4px;margin-top:7px;flex-wrap:wrap}
  .demand .d{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .demand .d.gone{background:var(--line)}
  .bay-state{font-size:17px;font-weight:800;margin-top:2px}
  .fishdots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}
  .fishdots .fd{width:7px;height:7px;border-radius:50%;background:var(--sea);opacity:.85}
  .stand{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .stand .p{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
  .chip{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .coin{font-family:var(--mono);font-weight:800;font-variant-numeric:tabular-nums}

  .bay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
  .spot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:5px;min-height:112px;position:relative}
  button.spot{transition:transform .08s,border-color .15s,box-shadow .15s}
  button.spot:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
  button.spot:disabled{opacity:.45;cursor:not-allowed}
  .spot .nm{font-weight:800;font-size:14px}
  .spot .rumor{font-size:13px;font-weight:600}
  .spot .school{display:flex;gap:3px;flex-wrap:wrap;min-height:10px}
  .spot .school .s{width:8px;height:8px;border-radius:50%}
  .spot .school .s.cod{background:var(--cod)} .spot .school .s.bass{background:var(--bass)} .spot .school .s.tuna{background:var(--tuna)}
  .spot .boats{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
  .spot .boats .bt{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
  .spot .haz{position:absolute;top:10px;right:11px;font-size:12px}
  .spot.dead{opacity:.5}
  .spot.chosen{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .stage h2{font-size:16px;margin-bottom:5px}
  .stage .hint{color:var(--muted);font-size:13.5px;margin-bottom:12px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#03211e}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.wide{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:220px;text-align:left}
  .btn.wide .sub{font-size:11.5px;color:var(--muted);font-weight:600}

  .reveal{font-size:20px;font-weight:800;min-height:30px;margin:6px 0;display:flex;align-items:center;gap:10px}
  .reveal .em{font-size:30px}
  .reveal.big{color:var(--gold)}
  .hold{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .hold .h{font-family:var(--mono);font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px}
  .hold .h .em{font-size:19px}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  .dot.cod{background:var(--cod)} .dot.bass{background:var(--bass)} .dot.tuna{background:var(--tuna)}
  .tension{display:flex;gap:6px;align-items:center;margin:12px 0}
  .tension .pip{width:26px;height:11px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
  .tension .pip.on{background:var(--warn);border-color:var(--warn)} .tension .pip.max{background:var(--bad);border-color:var(--bad)}
  .banner{padding:11px 14px;border-radius:10px;font-size:13.5px;margin:10px 0}
  .banner.good{background:color-mix(in srgb,var(--good) 15%,transparent);border:1px solid var(--good)}
  .banner.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);border:1px solid var(--bad)}
  .banner.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);border:1px solid var(--gold)}
  .legend{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.6}

  .mtable{display:flex;flex-direction:column;gap:9px;margin:8px 0}
  .mrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mtip{font-size:12.5px;color:var(--muted)} .mtip.up{color:var(--gold);font-weight:700}

  .log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px 10px 14px;box-shadow:var(--shadow)}
  .log h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .log .feed{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:8px}
  .log .ln{font-size:13px;color:var(--muted);line-height:1.5}
  .log .ln b{color:var(--ink)} .log .ln .g{color:var(--good)} .log .ln .gold{color:var(--gold);font-weight:700}

  .setup{max-width:560px;margin:5vh auto 0}
  .setup p{color:var(--muted);font-size:14px}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  select{font-family:inherit;font-size:14px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  .results .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .results .row.win{color:var(--accent);font-weight:800}
  @media (prefers-reduced-motion:no-preference){
    .reveal .em{animation:pop .25s ease}
    @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  }
</style>

<div class="wrap">
  <div class="mast">
    <div class="title">Over<span class="sub">board</span></div>
    <div class="ver" id="phaseTag">a little fishing game</div>
  </div>
  <div id="app"></div>
</div>

<script>
"use strict";
window.addEventListener("error", function(e){
  var a=document.getElementById("app");
  if(a && !a.dataset.crashed){ a.dataset.crashed="1";
    a.innerHTML='<div class="stage"><h2>Something broke</h2><div class="hint">'+((e&&e.message)||"unknown error")+'</div></div>'; }
});

/* =========================================================================
   OVERBOARD v0.4 — the fun-first pass.
   The economy is felt, not calculated: no forecasts, no price ladders, no
   net-worth math. Just "the town wants THIS fish today" (dots, like M.U.L.E.),
   the joy of the catch, and a sea you can love or wreck. Engine stays separate
   from render() so it can move to a TV+iPad server later.
   ========================================================================= */

const FISH = {
  cod:  { name:"Cod",  val:1, em:"🐟", cls:"cod"  },
  bass: { name:"Bass", val:2, em:"🐠", cls:"bass" },
  tuna: { name:"Tuna", val:4, em:"🦈", cls:"tuna" },
};
const SPECIES = ["cod","bass","tuna"];

const CFG = {
  hold: 5,
  boatHold: 3,           // Bigger Boat upgrade
  snapAt: 3,             // snags before the line breaks
  lineSnapAt: 4,         // Strong Line upgrade
  startCoins: 6,
  collapse: 16,          // the bay is in trouble below this many fish
  wantedMult: 2,         // Catch of the Day pays double
  spotsDef: [
    { id:"sa", name:"Sandy Shallows", stock:{cod:4,bass:1,tuna:0}, snags:2 },
    { id:"sb", name:"Kelp Beds",      stock:{cod:4,bass:2,tuna:0}, snags:2 },
    { id:"ba", name:"The Banks",      stock:{cod:5,bass:3,tuna:0}, snags:2 },
    { id:"bb", name:"Gull Rock",      stock:{cod:3,bass:4,tuna:1}, snags:3 },
    { id:"reef", name:"Coral Reef",   stock:{cod:3,bass:4,tuna:2}, snags:3 },
    { id:"trench", name:"The Deep",   stock:{cod:2,bass:3,tuna:5}, snags:4 },
  ],
  aiRoster: [
    { name:"Reef Hog", pers:"greedy",   color:"#c65046" },
    { name:"Old Salt", pers:"cautious", color:"#3f93c4" },
    { name:"Barnacle", pers:"chaos",    color:"#9a6cc9" },
  ],
  humanColor:"#0f9a8e",
};

const UPGRADES = [
  { key:"sonar", name:"Fish Finder", cost:6, em:"📡", desc:"See what's swimming in every spot before you pick." },
  { key:"line",  name:"Strong Line", cost:6, em:"🪢", desc:"Takes 4 snags to break instead of 3 — push your luck harder." },
  { key:"boat",  name:"Bigger Boat", cost:9, em:"⛵", desc:"Carry 3 more fish every single trip." },
];

const WEATHER = [
  { key:"calm",  text:"Clear skies and calm water.", apply(){} },
  { key:"storm", text:"Storm over the Shallows — those spots are closed today.",
    apply(S){ S.closed=["sa","sb"]; } },
  { key:"run",   text:"A big shoal is running at the Reef — it's boiling out there!",
    apply(S){ const r=S.spots.find(s=>s.id==="reef"); r.stock.bass+=2; r.stock.tuna+=1; } },
  { key:"gulls", text:"Gulls are working the Deep — the fish are biting.",
    apply(S){ const r=S.spots.find(s=>s.id==="trench"); r.stock.tuna+=2; } },
];

let STATE=null;

/* ---------- helpers ---------- */
const sum = o => o.cod+o.bass+o.tuna;
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
function seaHealth(S){ return S.spots.reduce((n,s)=>n+sum(s.stock),0); }
function holdCap(id){ return CFG.hold + (STATE.up[id].boat?CFG.boatHold:0); }
function snapLimit(id){ return STATE.up[id].line?CFG.lineSnapAt:CFG.snapAt; }
function coins(n){ return "🪙"+n; }
function log(html){ STATE.log.unshift(html); if(STATE.log.length>50) STATE.log.pop(); }
function schoolDots(s){
  return SPECIES.map(t=>Array(s.stock[t]).fill(`<span class="s ${t}"></span>`).join("")).join("");
}
function heldEmoji(h){
  return SPECIES.filter(t=>h[t]>0).map(t=>`${FISH[t].em}${h[t]>1?"×"+h[t]:""}`).join("  ") || "empty";
}

/* ---------- new game ---------- */
function newGame(nPlayers, days){
  const players=[{ id:0, name:"You", human:true, color:CFG.humanColor }];
  for(let i=0;i<nPlayers-1;i++){ const a=CFG.aiRoster[i]; players.push({ id:i+1, name:a.name, human:false, pers:a.pers, color:a.color }); }
  const coinsBag={}, hold={}, up={};
  players.forEach(p=>{ coinsBag[p.id]=CFG.startCoins; hold[p.id]={cod:0,bass:0,tuna:0}; up[p.id]={sonar:false,line:false,boat:false}; });
  STATE={ day:1, maxDays:days, phase:"sail", players, coins:coinsBag, hold, up,
    spots: CFG.spotsDef.map(s=>({ id:s.id, name:s.name, stock:clone(s.stock), snags:s.snags, start:clone(s.stock), seen:false })),
    choices:{}, closed:[], weather:null, wanted:null, demandLeft:0, demandMax:0,
    firstSeller:0, reel:null, market:null, night:null, log:[] };
  startDay();
}
function startDay(){
  const S=STATE;
  S.phase="sail"; S.choices={}; S.closed=[];
  S.weather=pick(WEATHER); S.weather.apply(S);
  // Catch of the Day — the town craves one fish (pays double up to its appetite)
  S.wanted=pick(SPECIES);
  S.demandMax=2*S.players.length; S.demandLeft=S.demandMax;
  log(`<span class="ln"><b>— Day ${S.day} —</b> The town wants <b>${FISH[S.wanted].name}</b> ${FISH[S.wanted].em} today.</span>`);
  render();
}

/* ---------- SAIL ---------- */
function humanPick(spotId){
  const S=STATE; if(S.phase!=="sail" || S.closed.includes(spotId)) return;
  S.choices[0]=spotId;
  S.players.filter(p=>!p.human).forEach(p=> S.choices[p.id]=aiPickSpot(p));
  resolveFishing();
}
function spotVal(s){ return s.stock.cod + s.stock.bass*2 + s.stock.tuna*4; }
function aiPickSpot(p){
  const S=STATE;
  const open=S.spots.filter(s=>!S.closed.includes(s.id) && sum(s.stock)>0);
  const pool=open.length?open:S.spots.filter(s=>!S.closed.includes(s.id));
  if(p.pers==="chaos") return pick(pool).id;
  const score=s=>{ let v=spotVal(s); if(S.wanted) v+=s.stock[S.wanted]*3; if(p.pers==="cautious") v/=(s.snags+1); return v; };
  return pool.slice().sort((a,b)=>score(b)-score(a))[0].id;
}

/* ---------- REEL ---------- */
function drawToken(spot){
  const st=spot.stock, total=st.cod+st.bass+st.tuna+spot.snags;
  if(total<=0) return null;
  let r=rnd(total);
  if(r<st.cod){ st.cod--; return "cod"; } r-=st.cod;
  if(r<st.bass){ st.bass--; return "bass"; } r-=st.bass;
  if(r<st.tuna){ st.tuna--; return "tuna"; }
  return "snag";
}
function bestFish(h){ if(h.tuna>0)return"tuna"; if(h.bass>0)return"bass"; if(h.cod>0)return"cod"; return null; }

function resolveFishing(){
  const S=STATE, humanSpot=S.choices[0];
  S.spots.forEach(s=>{ if(Object.values(S.choices).includes(s.id)) s.seen=true; });
  [...new Set(Object.values(S.choices))].forEach(sid=>{
    const boats=S.players.filter(p=>S.choices[p.id]===sid);
    if(boats.some(b=>b.human)) return;
    runSpotAuto(sid, boats.map(b=>b.id));
  });
  const boats=S.players.filter(p=>S.choices[p.id]===humanSpot).map(p=>p.id);
  const status={}; boats.forEach(id=>status[id]={t:0,active:true});
  S.reel={ spotId:humanSpot, order:boats, ptr:0, status, reveal:"", big:false, done:false };
  S.phase="reel"; reelStep();
}
function runSpotAuto(sid, ids){
  const S=STATE, spot=S.spots.find(s=>s.id===sid);
  const status={}; ids.forEach(id=>status[id]={t:0,active:true});
  let guard=0;
  while(ids.some(id=>status[id].active) && guard++<300) ids.forEach(id=>{ if(status[id].active) aiReelTurn(id,spot,status[id]); });
  const crowd=ids.length>1?" (shared)":"";
  ids.forEach(id=>{ const p=S.players.find(x=>x.id===id);
    log(`<span class="ln"><b style="color:${p.color}">${p.name}</b> fished ${spot.name}${crowd} — caught ${heldEmoji(S.hold[id])}.</span>`); });
}
function aiReelTurn(id, spot, st){
  const S=STATE, p=S.players.find(x=>x.id===id), h=S.hold[id];
  if(sum(h)>=holdCap(id) || sum(spot.stock)<=0){ st.active=false; return; }
  const stopAt = p.pers==="cautious"?1 : snapLimit(id)-1;
  const go = p.pers==="chaos" ? (st.t<snapLimit(id)-1 && Math.random()<0.7) : st.t<stopAt;
  if(!go){ st.active=false; return; }
  const tok=drawToken(spot);
  if(tok==="snag"){ st.t++; if(st.t>=snapLimit(id)){ const b=bestFish(h); if(b) h[b]--; st.active=false; } }
  else if(tok){ h[tok]++; if(sum(h)>=holdCap(id)) st.active=false; }
  else st.active=false;
}
function reelStep(){
  const S=STATE, R=S.reel; let guard=0;
  while(guard++<400){
    if(!R.status[0].active){ reelEnded(); return; }
    const id=R.order[R.ptr], st=R.status[id];
    if(!st.active){ R.ptr=(R.ptr+1)%R.order.length; continue; }
    if(id===0){ render(); return; }
    aiReelTurn(id, S.spots.find(s=>s.id===R.spotId), st);
    R.ptr=(R.ptr+1)%R.order.length;
  }
  reelEnded();
}
function reelEnded(){
  const S=STATE, R=S.reel; if(R.done) return;
  const spot=S.spots.find(s=>s.id===R.spotId); let guard=0;
  while(R.order.some(id=>id!==0 && R.status[id].active) && guard++<400)
    R.order.forEach(id=>{ if(id!==0 && R.status[id].active) aiReelTurn(id,spot,R.status[id]); });
  R.done=true; render();
}
function humanReel(action){
  const S=STATE, R=S.reel; if(!R||!R.status[0].active) return;
  const st=R.status[0], h=S.hold[0], spot=S.spots.find(s=>s.id===R.spotId);
  R.big=false;
  if(action==="stop"){ st.active=false; R.reveal=""; }
  else if(sum(h)>=holdCap(0)){ st.active=false; }
  else {
    const tok=drawToken(spot);
    if(tok==="snag"){
      st.t++;
      if(st.t>=snapLimit(0)){ const b=bestFish(h);
        R.reveal = b?`💨 SNAP! Your ${FISH[b].name} got away!`:"💨 SNAP! The line broke.";
        if(b) h[b]--; st.active=false;
      } else R.reveal=`…a snag. The line groans (${st.t}/${snapLimit(0)}).`;
    } else if(tok){
      h[tok]++;
      const f=FISH[tok];
      R.big = tok==="tuna";
      R.reveal = tok==="tuna" ? `${f.em} A TUNA! The big one!` : tok==="bass" ? `${f.em} A fat Bass!` : `${f.em} A Cod.`;
      if(sum(h)>=holdCap(0)){ st.active=false; R.reveal+=" Boat's full!"; }
    } else { st.active=false; R.reveal="Nothing left biting here."; }
  }
  R.ptr=(R.ptr+1)%R.order.length; reelStep();
}
function endReel(){ const S=STATE; S.reel=null; startMarket(); }

/* ---------- DOCK ---------- */
function startMarket(){
  const S=STATE;
  const order=[]; for(let i=0;i<S.players.length;i++) order.push(S.players[(S.firstSeller+i)%S.players.length].id);
  S.market={ order, idx:0 }; S.phase="market"; processMarket();
}
function sellCatch(id){
  const S=STATE, h=S.hold[id]; let earned=0, bonus=0;
  SPECIES.forEach(t=>{
    while(h[t]>0){
      let v=FISH[t].val;
      if(t===S.wanted && S.demandLeft>0){ v*=CFG.wantedMult; S.demandLeft--; bonus++; }
      earned+=v; h[t]--;
    }
  });
  S.coins[id]+=earned;
  return { earned, bonus };
}
function processMarket(){
  const S=STATE, M=S.market;
  while(M.idx<M.order.length){
    const id=M.order[M.idx], p=S.players.find(x=>x.id===id);
    if(p.human){ render(); return; }
    const r=sellCatch(id);
    log(`<span class="ln"><b style="color:${p.color}">${p.name}</b> sold up for <span class="g">${coins(r.earned)}</span>${r.bonus?` <span class="gold">(${r.bonus} catch-of-the-day!)</span>`:""}.</span>`);
    M.idx++;
  }
  startOutfit();
}
function humanSellNow(){
  const S=STATE; if(S.phase!=="market" || S.market.order[S.market.idx]!==0) return;
  const r=sellCatch(0);
  S.marketResult=r;
  log(`<span class="ln"><b style="color:${CFG.humanColor}">You</b> sold up for <span class="g">${coins(r.earned)}</span>${r.bonus?` <span class="gold">(${r.bonus} catch-of-the-day!)</span>`:""}.</span>`);
  S.market.idx++; processMarket();
}

/* ---------- OUTFIT ---------- */
function startOutfit(){
  const S=STATE;
  S.players.filter(p=>!p.human).forEach(p=>aiBuy(p.id));
  // skip the shop entirely if the human can't afford anything — keeps it breezy
  const cheapest=Math.min.apply(null,UPGRADES.filter(u=>!S.up[0][u.key]).map(u=>u.cost).concat([999]));
  if(S.coins[0]<cheapest){ startNight(); return; }
  S.phase="outfit"; render();
}
function aiBuy(id){
  const S=STATE, p=S.players.find(x=>x.id===id);
  const order = p.pers==="greedy"?["boat","line","sonar"] : p.pers==="cautious"?["sonar","line","boat"] : ["line","boat","sonar"];
  for(const k of order){ const u=UPGRADES.find(x=>x.key===k);
    if(!S.up[id][k] && S.coins[id]>=u.cost){ S.coins[id]-=u.cost; S.up[id][k]=true;
      log(`<span class="ln"><b style="color:${p.color}">${p.name}</b> fitted a <span class="gold">${u.name}</span> ${u.em}.</span>`); return; } }
}
function humanBuy(key){
  const S=STATE, u=UPGRADES.find(x=>x.key===key);
  if(!u||S.up[0][key]||S.coins[0]<u.cost) return;
  S.coins[0]-=u.cost; S.up[0][key]=true;
  log(`<span class="ln"><b style="color:${CFG.humanColor}">You</b> fitted a <span class="gold">${u.name}</span> ${u.em}.</span>`);
  render();
}
function outfitDone(){ startNight(); }

/* ---------- NIGHT ---------- */
function startNight(){
  const S=STATE; let bred=0;
  S.spots.forEach(s=>{
    if(sum(s.stock)>=2){
      if(s.stock.cod<s.start.cod){ s.stock.cod++; bred++; }
      const rare = s.start.tuna>0?"tuna":(s.start.bass>0?"bass":null);
      if(rare && s.stock[rare]<s.start[rare]){ s.stock[rare]++; bred++; }
    }
  });
  const health=seaHealth(S);
  S.night={ bred, health, crisis: health<CFG.collapse };
  if(health<CFG.collapse) log(`<span class="ln"><span class="gold">⚠ The bay is getting fished out (${health} left).</span></span>`);
  S.firstSeller=(S.firstSeller+1)%S.players.length;
  S.phase="night"; render();
}
function nextDay(){ const S=STATE; if(S.day>=S.maxDays){ endGame(); return; } S.day++; startDay(); }
function endGame(){ const S=STATE; S.collapsed=seaHealth(S)<CFG.collapse; S.phase="over"; render(); }

/* ---------- render ---------- */
function bayState(h){ if(h<CFG.collapse)return{t:"Struggling",c:"var(--bad)"}; if(h<26)return{t:"Thinning",c:"var(--warn)"}; return{t:"Thriving",c:"var(--good)"}; }

function hud(){
  const S=STATE, health=seaHealth(S), bs=bayState(health);
  const dots=Array(S.demandMax).fill(0).map((_,i)=>`<span class="d ${i>=S.demandLeft?'gone':''}"></span>`).join("");
  const fishdots=Array(Math.min(health,30)).fill('<span class="fd"></span>').join("");
  const stand=S.players.slice().sort((a,b)=>S.coins[b.id]-S.coins[a.id]).map(p=>{
    const ups=["sonar","line","boat"].filter(k=>S.up[p.id][k]).length;
    return `<div class="p"><span><span class="chip" style="background:${p.color}"></span>${p.name}${ups?` <span style="color:var(--faint)">·${ups}⚙</span>`:""}</span><span class="coin">${coins(S.coins[p.id])}</span></div>`;
  }).join("");
  return `<div class="hud">
    <div class="card stat"><div class="label">Day</div><div class="big">${S.day}<span style="color:var(--faint);font-size:15px"> / ${S.maxDays}</span></div></div>
    <div class="card"><div class="label">Catch of the Day</div>
      <div class="catch"><span class="em">${FISH[S.wanted].em}</span><span class="nm">${FISH[S.wanted].name}</span><span style="color:var(--gold);font-weight:700">×2</span></div>
      <div class="demand">${dots}</div></div>
    <div class="card"><div class="label">The Bay</div><div class="bay-state" style="color:${bs.c}">${bs.t}</div><div class="fishdots">${fishdots}</div></div>
    <div class="card"><div class="label">Coins</div><div class="stand">${stand}</div></div>
  </div>`;
}

function bay(clickable){
  const S=STATE;
  return `<div class="bay">`+S.spots.map(s=>{
    const total=sum(s.stock), closed=S.closed.includes(s.id), dead=total<=1;
    const show = s.seen || S.up[0].sonar;
    const rumor = total<=1?{t:"Fished out",c:"var(--bad)"} : total<=4?{t:"Quiet",c:"var(--muted)"} : total<=8?{t:"Some ripples",c:"var(--sea)"} : {t:"Boiling!",c:"var(--good)"};
    const boats=Object.keys(S.choices).filter(id=>S.choices[id]===s.id).map(id=>{const p=S.players.find(x=>x.id==id);return `<span class="bt" style="border-color:${p.color}">${p.name}</span>`}).join("");
    const school = show ? `<div class="school">${schoolDots(s)||'<span style="color:var(--faint);font-size:12px">empty</span>'}</div>` : `<div class="school"><span style="color:var(--faint);font-size:12px">?</span></div>`;
    const tag = clickable && !closed && !dead ? "button":"div";
    const attr = clickable? `data-act="pick" data-spot="${s.id}" ${(closed||dead)?"disabled":""}`:"";
    return `<${tag} class="spot ${dead?'dead':''} ${S.choices[0]===s.id?'chosen':''}" ${attr}>
      <span class="haz">${"🪝".repeat(s.snags)}</span>
      <div class="nm">${s.name}</div>
      <div class="rumor" style="color:${rumor.c}">${closed?"⛈ Closed":rumor.t}</div>
      ${school}
      <div class="boats">${boats}</div></${tag}>`;
  }).join("")+`</div>`;
}

function stageSail(){
  const S=STATE, sonar=S.up[0].sonar;
  return `<div class="stage">
    <h2>Where to today, skipper?</h2>
    <div class="hint">${S.weather.text} ${sonar?"Your fish finder shows what's down there.":"You can't see exactly what's biting until you drop a line."} &nbsp;The town wants <b>${FISH[S.wanted].name} ${FISH[S.wanted].em}</b> — worth double.</div>
    ${bay(true)}
    <div class="legend">Dots show the fish in each spot (🪝 = snaggy water). ${FISH.tuna.em} Tuna only run Gull Rock, the Reef &amp; the Deep. Pick the same spot as a rival and you'll share the fish.</div>
  </div>`;
}

function stageReel(){
  const S=STATE, R=S.reel, st=R.status[0], h=S.hold[0], spot=S.spots.find(s=>s.id===R.spotId);
  const holdRow=`<div class="hold">${SPECIES.map(t=>`<span class="h"><span class="em">${FISH[t].em}</span>${h[t]}</span>`).join("")}<span class="h" style="color:var(--faint)">${sum(h)}/${holdCap(0)}</span></div>`;
  if(R.done){
    return `<div class="stage"><h2>Back to the boat</h2>
      <div class="reveal ${R.big?'big':''}">${R.reveal||"You reel in and head for the dock."}</div>
      ${holdRow}
      <div class="hint">Nice haul. Take it to the dock — ${FISH[S.wanted].name} ${FISH[S.wanted].em} pays double today.</div>
      <div class="btnrow"><button class="btn primary" data-act="to-dock">To the dock →</button></div></div>`;
  }
  const lim=snapLimit(0), atRisk=bestFish(h);
  const pips=Array(lim).fill(0).map((_,i)=>`<span class="pip ${st.t>i?(i>=lim-1?'max':'on'):''}"></span>`).join("");
  const others=R.order.filter(id=>id!==0);
  const crowd=others.length?`<div class="hint">Sharing ${spot.name} with ${others.map(id=>S.players.find(p=>p.id==id).name).join(", ")} — the fish thin out between casts.</div>`:"";
  const warn = st.t>=lim-1 ? `<div class="banner bad">Line's about to go! One more snag and your ${atRisk?FISH[atRisk].name:"catch"} is gone.</div>` : "";
  return `<div class="stage"><h2>Fishing · ${spot.name}</h2>
    <div class="hint">Cast again for another fish, or bring it in. ${lim} snags and the line snaps${atRisk?` — you'd lose your ${FISH[atRisk].name}`:""}.</div>
    ${crowd}
    <div class="reveal ${R.big?'big':''}">${R.reveal||"&nbsp;"}</div>
    ${holdRow}
    <div class="tension">${pips} <span class="label" style="margin-left:6px">line</span></div>
    ${warn}
    <div class="btnrow">
      <button class="btn primary" data-act="reel-draw" ${sum(h)>=holdCap(0)?"disabled":""}>🎣 Cast again</button>
      <button class="btn" data-act="reel-stop">Bring it in</button>
    </div></div>`;
}

function stageMarket(){
  const S=STATE, myTurn=S.market.order[S.market.idx]===0, h=S.hold[0];
  if(!myTurn){ const who=S.players.find(p=>p.id===S.market.order[S.market.idx]);
    return `<div class="stage"><h2>At the dock</h2><div class="hint">${who?who.name:"A rival"} is selling first…</div></div>`; }
  const total=sum(h);
  const wantedHave=h[S.wanted];
  const bonusNow=Math.min(wantedHave, S.demandLeft);
  return `<div class="stage"><h2>Sell your catch</h2>
    <div class="hint">The town's buying. <b>${FISH[S.wanted].name} ${FISH[S.wanted].em}</b> pays <b>double</b> until they've had their fill (${S.demandLeft} left).</div>
    <div class="hold">${SPECIES.map(t=>`<span class="h"><span class="em">${FISH[t].em}</span>${h[t]}</span>`).join("")}</div>
    ${bonusNow>0?`<div class="banner gold">You've got ${bonusNow} ${FISH[S.wanted].name} the town wants — that's the good money today! 🤑</div>`
      :wantedHave>0?`<div class="banner">The town's had its fill of ${FISH[S.wanted].name} — yours sell at the usual price.</div>`
      :`<div class="banner">No ${FISH[S.wanted].name} in your hold today — you'll sell at the usual prices.</div>`}
    <div class="btnrow"><button class="btn primary" data-act="sell-now">${total>0?`Sell all ${total} fish`:"Head on (empty-handed)"}</button></div>
    <div class="legend">${FISH.cod.em} Cod ${coins(1)} · ${FISH.bass.em} Bass ${coins(2)} · ${FISH.tuna.em} Tuna ${coins(4)} — and the Catch of the Day pays double. Simple: catch what the town wants.</div>
  </div>`;
}

function stageOutfit(){
  const S=STATE, c=S.coins[0];
  const cards=UPGRADES.map(u=>{ const owned=S.up[0][u.key], afford=c>=u.cost;
    return `<div class="mrow">
      <button class="btn wide" data-act="buy" data-key="${u.key}" ${(owned||!afford)?"disabled":""}>
        <span>${u.em} <b>${u.name}</b> ${owned?'<span class="sub" style="color:var(--good)">· fitted</span>':`<span class="sub">· ${coins(u.cost)}</span>`}</span>
        <span class="sub">${u.desc}</span></button>
      ${owned?'<span class="mtip up">✓</span>':(afford?'':'<span class="mtip">save up a little</span>')}</div>`;
  }).join("");
  return `<div class="stage"><h2>Treat your boat? 🛠️</h2>
    <div class="hint">You've got ${coins(c)}. Gear makes fishing easier and richer for the rest of the trip — or bank it and keep fishing.</div>
    <div class="mtable">${cards}</div>
    <div class="btnrow"><button class="btn primary" data-act="outfit-done">Head home for the night →</button></div>
  </div>`;
}

function stageNight(){
  const S=STATE, N=S.night, last=S.day>=S.maxDays, bs=bayState(N.health);
  return `<div class="stage"><h2>Nightfall</h2>
    ${N.crisis?`<div class="banner bad">The bay's looking bare (${N.health} fish). Ease off, or there'll be nothing left to catch — and a dead bay means nobody wins.</div>`
      :`<div class="banner good">The bay is <b>${bs.t}</b> — ${N.bred} new fish moved in overnight.</div>`}
    <div class="btnrow"><button class="btn primary" data-act="next-day">${last?"See how the season went":"Sail into Day "+(S.day+1)+" →"}</button></div>
  </div>`;
}

function stageOver(){
  const S=STATE, mult=S.collapsed?0.5:1;
  const score={}; S.players.forEach(p=> score[p.id]=Math.floor(S.coins[p.id]*mult));
  const ranked=S.players.slice().sort((a,b)=>score[b.id]-score[a.id]), win=ranked[0];
  const rows=ranked.map((p,i)=>`<div class="row ${i===0?'win':''}"><span><span class="chip" style="background:${p.color}"></span>${p.name}${i===0?" 🏆":""}</span><span class="coin">${coins(score[p.id])}</span></div>`).join("");
  return `<div class="stage results"><h2>Season's end</h2>
    ${S.collapsed?`<div class="banner bad">The bay was fished dry — everyone's coins were halved. Next time, leave some fish in the sea. 🐟</div>`:`<div class="banner good">The bay came through the season healthy. Well fished! 🎣</div>`}
    <div style="margin:10px 0">${rows}</div>
    <div class="hint">${win.human?"You're the top skipper on the dock! 🏆":win.name+" took top skipper this season — get 'em next time."}</div>
    <div class="btnrow"><button class="btn primary" data-act="restart">Another season</button></div>
    <div class="legend">Greybox v0.4 — simpler &amp; friendlier: no forecasts or price math, just chase the Catch of the Day, land the big one, and mind the bay. Fun to play a few rounds? Then art + the TV/iPad build.</div>
  </div>`;
}

function setup(){
  return `<div class="setup"><div class="stage">
    <h2>Overboard 🎣</h2>
    <p>A little fishing game. Pick your spot, reel up a catch (press your luck for the big one!), and sell to a town that craves a different fish each day. Land more than the rival skippers — but don't fish the bay dry.</p>
    <div class="field"><span class="label">Skippers (you + rivals)</span>
      <select id="np"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div>
    <div class="field"><span class="label">Days</span>
      <select id="nd"><option>4</option><option selected>5</option><option>6</option></select></div>
    <div class="btnrow" style="margin-top:16px"><button class="btn primary" data-act="start">🚤 Cast off</button></div>
    <div class="legend">Your rivals: Reef Hog (greedy), Old Salt (steady), Barnacle (a bit chaotic).</div>
  </div></div>`;
}

function render(){
  const S=STATE, app=document.getElementById("app"), tag=document.getElementById("phaseTag");
  if(!S){ app.innerHTML=setup(); if(tag)tag.textContent="a little fishing game"; return; }
  const P=S.phase; let stage="";
  if(P==="sail") stage=stageSail();
  else if(P==="reel") stage=stageReel();
  else if(P==="market") stage=stageMarket();
  else if(P==="outfit") stage=stageOutfit();
  else if(P==="night") stage=stageNight();
  else if(P==="over"){ app.innerHTML=stageOver(); if(tag)tag.textContent="season over"; return; }
  const feed=`<div class="log"><h3>On the water</h3><div class="feed">${S.log.join("")||'<span class="ln">…</span>'}</div></div>`;
  app.innerHTML = hud() + (P==="market"&&S.market.order[S.market.idx]!==0?bay(false):"") + stage + feed;
  if(tag) tag.textContent = ({sail:"choosing a spot",reel:"fishing",market:"at the dock",outfit:"the boatyard",night:"nightfall"})[P]||"overboard";
}

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="start"){ newGame(parseInt(document.getElementById("np").value), parseInt(document.getElementById("nd").value)); }
  else if(a==="pick"){ humanPick(b.dataset.spot); }
  else if(a==="reel-draw"){ humanReel("draw"); }
  else if(a==="reel-stop"){ humanReel("stop"); }
  else if(a==="to-dock"){ endReel(); }
  else if(a==="sell-now"){ humanSellNow(); }
  else if(a==="buy"){ humanBuy(b.dataset.key); }
  else if(a==="outfit-done"){ outfitDone(); }
  else if(a==="next-day"){ nextDay(); }
  else if(a==="restart"){ STATE=null; render(); }
});

function boot(){ try{ render(); }catch(err){ var a=document.getElementById("app"); if(a) a.innerHTML='<div class="stage"><h2>Boot error</h2><div class="hint">'+((err&&err.message)||err)+'</div></div>'; } }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
</body>
</html>
